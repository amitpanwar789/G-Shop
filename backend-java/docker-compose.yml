version: '3.8'

services:
  user-service:
    build:
      context: ./user-service
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    environment:
      - SERVER_PORT=5000
    networks:
      - gshop-network

  product-service:
    build:
      context: ./product-service
      dockerfile: Dockerfile
    ports:
      - "5001:5001"
    environment:
      - SERVER_PORT=5001
    volumes:
      - uploads-data:/app/uploads
    networks:
      - gshop-network

  order-service:
    build:
      context: ./order-service    
      dockerfile: Dockerfile
    ports:
      - "5003:5003"
    environment:
      - SERVER_PORT=5003
    networks:
      - gshop-network

  rabbitmq:
    image: rabbitmq:3-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - gshop-network

  notification-service:
    build:
      context: ./notification-service
      dockerfile: Dockerfile
    ports:
      - "5004:5004"
    environment:
      - SERVER_PORT=5004
      - SPRING_RABBITMQ_HOST=rabbitmq
    depends_on:
      - rabbitmq
    networks:
      - gshop-network

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    volumes:
      - frontend_build:/var/www/frontend
    networks:
      - gshop-network

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - uploads-data:/app/uploads:ro
      - frontend_build:/var/www/frontend:ro
    depends_on:
      - user-service
      - product-service
      - order-service
      - frontend
      - notification-service
    networks:
      - gshop-network

volumes:
  uploads-data:
  frontend_build:

networks:
  gshop-network:
    driver: bridge
